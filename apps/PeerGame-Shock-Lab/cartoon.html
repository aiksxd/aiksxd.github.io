<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡牌对战闪电攻击动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px 0;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            margin-bottom: 40px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 3rem;
            background: linear-gradient(to right, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #a0d2eb;
            margin-bottom: 20px;
        }

        .game-area {
            display: flex;
            justify-content: space-between;
            gap: 40px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            flex: 1;
        }

        .card {
            background: linear-gradient(135deg, #0f3460, #1b1b2f);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid #4a4a8a;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            border-color: #00f2fe;
        }

        .card h3 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: #4facfe;
        }

        .card p {
            font-size: 0.9rem;
            color: #a0d2eb;
        }

        .card .mana {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        .controls {
            width: 300px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            align-self: flex-start;
        }

        .controls h2 {
            color: #4facfe;
            margin-bottom: 20px;
            text-align: center;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 242, 254, 0.6);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .animation-target {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 30px;
            border-radius: 10px;
            text-align: center;
            font-size: 1.5rem;
            color: #00f2fe;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.5);
            border: 2px solid #00f2fe;
        }

        /* 闪电容器 */
        #lightning-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        /* 闪光效果 */
        #flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            opacity: 0;
            pointer-events: none;
            z-index: 998;
        }

        /* 粒子效果 */
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 997;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #a0d2eb;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .game-area {
                flex-direction: column;
            }
            
            .controls {
                width: 100%;
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>卡牌对战闪电攻击</h1>
            <p class="subtitle">点击卡牌或使用控制面板触发全屏闪电攻击动画</p>
        </header>
        
        <div class="game-area">
            <div class="card-grid">
                <div class="card" data-card-id="1">
                    <div class="mana">3</div>
                    <h3>雷霆之怒</h3>
                    <p>召唤闪电攻击敌人</p>
                </div>
                <div class="card" data-card-id="2">
                    <div class="mana">5</div>
                    <h3>风暴召唤者</h3>
                    <p>引发巨大雷电风暴</p>
                </div>
                <div class="card" data-card-id="3">
                    <div class="mana">2</div>
                    <h3>闪电链</h3>
                    <p>连锁闪电攻击多个目标</p>
                </div>
                <div class="card" data-card-id="4">
                    <div class="mana">4</div>
                    <h3>雷神之锤</h3>
                    <p>释放强大的雷霆一击</p>
                </div>
                <div class="card" data-card-id="5">
                    <div class="mana">6</div>
                    <h3>天罚</h3>
                    <p>从天而降的神圣闪电</p>
                </div>
                <div class="card" data-card-id="6">
                    <div class="mana">1</div>
                    <h3>静电冲击</h3>
                    <p>快速释放的小型闪电</p>
                </div>
            </div>
            
            <div class="controls">
                <h2>动画控制</h2>
                <button class="btn" id="play-btn">播放闪电动画</button>
                <button class="btn" id="random-btn">随机位置动画</button>
                <div style="margin: 20px 0; height: 2px; background: linear-gradient(to right, transparent, #00f2fe, transparent);"></div>
                <p style="color: #a0d2eb; text-align: center; margin-top: 20px;">选择卡牌或点击按钮触发闪电攻击动画。闪电会从卡牌位置发出，直击页面顶部目标。</p>
            </div>
        </div>
        
        <footer>
            <p>卡牌对战游戏 | 闪电攻击动画特效 | 使用SVG和Canvas实现</p>
        </footer>
    </div>
    
    <div id="lightning-container"></div>
    <div id="flash-overlay"></div>
    <div class="animation-target">闪电击中目标!</div>

    <script>
        // 获取DOM元素
        const cards = document.querySelectorAll('.card');
        const playBtn = document.getElementById('play-btn');
        const randomBtn = document.getElementById('random-btn');
        const lightningContainer = document.getElementById('lightning-container');
        const flashOverlay = document.getElementById('flash-overlay');
        const animationTarget = document.querySelector('.animation-target');

        // 初始化目标位置
        animationTarget.style.display = 'none';

        // 闪电攻击函数
        function playLightningAnimation(sourceElement) {
            // 隐藏之前的闪电
            lightningContainer.innerHTML = '';
            
            // 显示目标
            animationTarget.style.display = 'block';
            
            // 获取起始位置（卡牌中心）
            const rect = sourceElement.getBoundingClientRect();
            const startX = rect.left + rect.width / 2;
            const startY = rect.top + rect.height / 2;
            
            // 结束位置（页面顶部中间）
            const endX = window.innerWidth / 2;
            const endY = 10;
            
            // 创建主闪电
            createMainLightning(startX, startY, endX, endY);
            
            // 创建闪电分支
            createLightningBranches(startX, startY, endX, endY);
            
            // 创建粒子效果
            createParticles(endX, endY);
            
            // 屏幕闪光效果
            flashScreen();
            
            // 播放音效
            playSound();
        }

        // 创建主闪电
        function createMainLightning(startX, startY, endX, endY) {
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("width", "100%");
            svg.setAttribute("height", "100%");
            svg.style.position = "absolute";
            svg.style.top = "0";
            svg.style.left = "0";
            svg.style.pointerEvents = "none";
            
            // 创建闪电路径
            const path = document.createElementNS(svgNS, "path");
            
            // 创建闪电形状（主路径添加一些随机点）
            const points = generateLightningPoints(startX, startY, endX, endY, 8);
            let d = `M ${startX} ${startY}`;
            points.forEach(point => {
                d += ` L ${point.x} ${point.y}`;
            });
            d += ` L ${endX} ${endY}`;
            
            path.setAttribute("d", d);
            path.setAttribute("stroke", "#4facfe");
            path.setAttribute("stroke-width", "4");
            path.setAttribute("fill", "none");
            path.setAttribute("filter", "url(#glow)");
            
            // 添加发光效果
            const defs = document.createElementNS(svgNS, "defs");
            const filter = document.createElementNS(svgNS, "filter");
            filter.setAttribute("id", "glow");
            
            const feGaussianBlur = document.createElementNS(svgNS, "feGaussianBlur");
            feGaussianBlur.setAttribute("stdDeviation", "3");
            feGaussianBlur.setAttribute("result", "coloredBlur");
            
            const feMerge = document.createElementNS(svgNS, "feMerge");
            const feMergeNode1 = document.createElementNS(svgNS, "feMergeNode");
            feMergeNode1.setAttribute("in", "coloredBlur");
            const feMergeNode2 = document.createElementNS(svgNS, "feMergeNode");
            feMergeNode2.setAttribute("in", "SourceGraphic");
            
            feMerge.appendChild(feMergeNode1);
            feMerge.appendChild(feMergeNode2);
            
            filter.appendChild(feGaussianBlur);
            filter.appendChild(feMerge);
            defs.appendChild(filter);
            
            svg.appendChild(defs);
            svg.appendChild(path);
            lightningContainer.appendChild(svg);
            
            // 添加动画
            path.style.opacity = "0";
            animate({
                el: path,
                opacity: [0, 1, 0.8, 0.5, 0],
                duration: 800,
                easing: "easeOutQuad"
            });
            
            // 结束后移除SVG
            setTimeout(() => {
                svg.remove();
            }, 1000);
        }

        // 生成闪电路径点
        function generateLightningPoints(startX, startY, endX, endY, segments) {
            const points = [];
            const dx = (endX - startX) / segments;
            const dy = (endY - startY) / segments;
            
            for (let i = 1; i < segments; i++) {
                const x = startX + i * dx + (Math.random() - 0.5) * 40;
                const y = startY + i * dy + (Math.random() - 0.5) * 40;
                points.push({ x, y });
            }
            
            return points;
        }

        // 创建闪电分支
        function createLightningBranches(startX, startY, endX, endY) {
            const branchCount = Math.floor(Math.random() * 4) + 3; // 3-6个分支
            
            for (let i = 0; i < branchCount; i++) {
                setTimeout(() => {
                    // 随机分支起点（在主路径上）
                    const branchStartX = startX + (endX - startX) * (0.2 + Math.random() * 0.6);
                    const branchStartY = startY + (endY - startY) * (0.2 + Math.random() * 0.6);
                    
                    // 随机分支终点
                    const angle = Math.random() * Math.PI * 2;
                    const length = 50 + Math.random() * 150;
                    const branchEndX = branchStartX + Math.cos(angle) * length;
                    const branchEndY = branchStartY + Math.sin(angle) * length;
                    
                    // 创建分支
                    createBranch(branchStartX, branchStartY, branchEndX, branchEndY);
                }, i * 100);
            }
        }

        // 创建单个分支
        function createBranch(startX, startY, endX, endY) {
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("width", "100%");
            svg.setAttribute("height", "100%");
            svg.style.position = "absolute";
            svg.style.top = "0";
            svg.style.left = "0";
            svg.style.pointerEvents = "none";
            
            const path = document.createElementNS(svgNS, "path");
            
            // 创建分支形状
            const segments = 3 + Math.floor(Math.random() * 3);
            const points = generateLightningPoints(startX, startY, endX, endY, segments);
            let d = `M ${startX} ${startY}`;
            points.forEach(point => {
                d += ` L ${point.x} ${point.y}`;
            });
            d += ` L ${endX} ${endY}`;
            
            path.setAttribute("d", d);
            path.setAttribute("stroke", "#00f2fe");
            path.setAttribute("stroke-width", "2");
            path.setAttribute("fill", "none");
            path.setAttribute("filter", "url(#glow)");
            
            svg.appendChild(path);
            lightningContainer.appendChild(svg);
            
            // 添加动画
            path.style.opacity = "0";
            animate({
                el: path,
                opacity: [0, 1, 0],
                duration: 400,
                easing: "easeOutQuad"
            });
            
            // 结束后移除
            setTimeout(() => {
                svg.remove();
            }, 500);
        }

        // 创建粒子效果
        function createParticles(x, y) {
            const particleCount = 100;
            
            for (let i = 0; i < particleCount; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    
                    // 粒子大小和颜色
                    const size = Math.random() * 6 + 2;
                    const colors = ['#4facfe', '#00f2fe', '#ffffff', '#a18cd1'];
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    
                    particle.style.width = `${size}px`;
                    particle.style.height = `${size}px`;
                    particle.style.backgroundColor = color;
                    particle.style.left = `${x}px`;
                    particle.style.top = `${y}px`;
                    
                    // 粒子动画
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 50 + Math.random() * 150;
                    const duration = 800 + Math.random() * 400;
                    
                    particle.style.boxShadow = `0 0 ${size * 2}px ${size}px ${color}`;
                    
                    document.body.appendChild(particle);
                    
                    animate({
                        el: particle,
                        left: [`${x}px`, `${x + Math.cos(angle) * distance}px`],
                        top: [`${y}px`, `${y + Math.sin(angle) * distance}px`],
                        opacity: [1, 0],
                        width: [`${size}px`, '0px'],
                        height: [`${size}px`, '0px'],
                        duration: duration,
                        easing: "easeOutQuad",
                        complete: () => {
                            particle.remove();
                        }
                    });
                }, i * 10);
            }
        }

        // 屏幕闪光效果
        function flashScreen() {
            flashOverlay.style.opacity = "0.8";
            
            animate({
                el: flashOverlay,
                opacity: [0.8, 0],
                duration: 500,
                easing: "easeOutQuad"
            });
        }

        // 播放音效
        function playSound() {
            // 由于代码执行环境限制，这里仅模拟音效播放
            console.log("播放闪电音效...");
            // 实际项目中可以添加真实的音效文件
        }

        // 动画函数
        function animate({ el, props, duration, easing, complete }) {
            if (typeof props === 'undefined') {
                props = {};
            }
            
            const startTime = performance.now();
            const initialProps = {};
            
            // 获取初始值
            for (const prop in props) {
                if (Array.isArray(props[prop])) {
                    initialProps[prop] = parseFloat(getComputedStyle(el)[prop]) || 0;
                }
            }
            
            function update(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easedProgress = easing === 'easeOutQuad' ? 
                    1 - Math.pow(1 - progress, 3) : progress;
                
                for (const prop in props) {
                    if (Array.isArray(props[prop])) {
                        const start = initialProps[prop];
                        const end = parseFloat(props[prop][1]);
                        const value = start + (end - start) * easedProgress;
                        
                        if (prop === 'opacity') {
                            el.style[prop] = value;
                        } else {
                            el.style[prop] = `${value}${prop === 'rotate' ? 'deg' : ''}`;
                        }
                    }
                }
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    if (complete) complete();
                }
            }
            
            requestAnimationFrame(update);
        }

        // 事件监听
        cards.forEach(card => {
            card.addEventListener('click', () => {
                playLightningAnimation(card);
            });
        });

        playBtn.addEventListener('click', () => {
            // 随机选择一张卡牌
            const randomCard = cards[Math.floor(Math.random() * cards.length)];
            playLightningAnimation(randomCard);
        });

        randomBtn.addEventListener('click', () => {
            // 在随机位置创建动画
            const randomX = Math.random() * window.innerWidth;
            const randomY = Math.random() * window.innerHeight * 0.8;
            
            // 创建一个临时元素作为动画源
            const tempElement = document.createElement('div');
            tempElement.style.position = 'fixed';
            tempElement.style.left = `${randomX}px`;
            tempElement.style.top = `${randomY}px`;
            tempElement.style.width = '0';
            tempElement.style.height = '0';
            document.body.appendChild(tempElement);
            
            playLightningAnimation(tempElement);
            
            // 动画结束后移除临时元素
            setTimeout(() => {
                tempElement.remove();
            }, 1000);
        });

    </script>
</body>
</html>
