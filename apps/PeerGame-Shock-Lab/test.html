<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多人游戏对战平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>.deck {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  padding: 20px;
}

.card {
  width: 150px;
  border: 1px solid #ccc;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  cursor: pointer;
  transition: transform 0.2s;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

.cost {
  background: #333;
  color: white;
  padding: 5px;
  font-size: 12px;
}

.card img {
  width: 100%;
  height: 120px;
  object-fit: cover;
}

.shortInfo {
  display: block;
  padding: 8px;
  text-align: center;
  font-size: 14px;
}
    </style>
</head>
<body><div id="deck-container" class="economy"></div>

<script>
// 全局卡牌存储
const cardDatabase = [];

// JSON数据解析函数
function parseCardDeck(jsonData) {
  const container = document.getElementById('deck-container');
  container.className = jsonData.deckClass;
  
  jsonData.cards.forEach((card, index) => {
    // 添加到全局数据库
    cardDatabase.push(card);
    
    // 构建费用显示字符串
    let costHtml = '';
    for (const [resource, amount] of Object.entries(card.cost)) {
      costHtml += `${resource}:${amount} `;
    }
    
    // 创建卡牌DOM元素
    const cardElement = document.createElement('div');
    cardElement.className = 'card';
    cardElement.dataset.index = index;
    
    cardElement.innerHTML = `
      <div class="cost">${costHtml}</div>
      <img src="${card.img}" alt="${card.name}">
      <span class="shortInfo">${card.shortInfo}</span>
    `;
    
    // 添加点击事件
    cardElement.addEventListener('click', () => {
      const cardData = cardDatabase[index];
      const func = window[cardData.invoke.func];
      if (func) {
        func(...cardData.invoke.args);
      } else {
        console.error(`Function ${cardData.invoke.func} not found`);
      }
    });
    
    container.appendChild(cardElement);
  });
}

// 示例调用函数（需在全局实现）
function gainResources(resourceType, amount) {
  console.log(`获得资源: ${amount} ${resourceType}`);
}

function healTarget(target, amount) {
  console.log(`治疗目标: ${target}, 恢复 ${amount} 生命值`);
}

function summonUnit(unitType, attack, health) {
  console.log(`召唤单位: ${unitType} (${attack}/${health})`);
}

// 初始化卡组
fetch('js/cards.json')
  .then(response => response.json())
  .then(parseCardDeck)
  .catch(console.error);
</script>
</body>
</html>
