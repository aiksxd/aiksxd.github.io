<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆角小闪电充电动画</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        h1 {
            color: white;
            margin-bottom: 30px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            font-weight: 300;
        }
        
        h1 strong {
            color: #FFD700;
            font-weight: 600;
        }
        
        .card {
            background: rgba(20, 30, 48, 0.8);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            min-width: 320px;
        }
        
        .battery-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            margin-bottom: 20px;
            padding: 0 10px;
            font-size: 14px;
        }
        
        .battery-level {
            font-size: 18px;
            font-weight: bold;
            color: #FFD700;
        }
        
        .battery-container {
            position: relative;
            width: 300px;
            height: 160px;
            margin: 0 auto;
        }
        
        .description {
            color: rgba(255, 255, 255, 0.8);
            margin-top: 25px;
            font-size: 14px;
            line-height: 1.6;
            max-width: 320px;
        }
        
        .restart-btn {
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #1a2a6c;
            border: none;
            padding: 10px 25px;
            border-radius: 30px;
            margin-top: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }
        
        .restart-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }
        
        .restart-btn:active {
            transform: translateY(1px);
        }
        
        .powered-by {
            color: rgba(255, 255, 255, 0.6);
            margin-top: 30px;
            font-size: 12px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>纯SVG <strong>圆角小闪电</strong> 充电动画</h1>
        
        <div class="card">
            <div class="battery-info">
                <div>电池状态: <span id="status">正在充电...</span></div>
                <div class="battery-level"><span id="percentage">0%</span></div>
            </div>
            
            <div class="battery-container">
                <svg width="300" height="160" viewBox="0 0 300 160" xmlns="http://www.w3.org/2000/svg">
                    <!-- 电池外壳 -->
                    <rect x="50" y="40" width="200" height="80" rx="15" ry="15" fill="none" stroke="#6A7C94" stroke-width="3"/>
                    <rect x="250" y="65" width="10" height="30" rx="3" ry="3" fill="#6A7C94"/>
                    
                    <!-- 充电填充 -->
                    <defs>
                        <linearGradient id="chargeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#4A6FA5"/>
                            <stop offset="100%" stop-color="#2E9BFF"/>
                        </linearGradient>
                    </defs>
                    
                    <rect id="chargeLevel" x="52" y="42" width="0" height="76" rx="13" ry="13" fill="url(#chargeGradient)">
                        <animate attributeName="width" from="0" to="196" dur="4s" fill="freeze" begin="0.5s" repeatCount="1" id="chargeAnim"/>
                    </rect>
                    
                    <!-- 圆角闪电图标 -->
                    <g id="lightning">
                        <path d="M150 65 L135 85 L145 85 L130 105 L150 85 L140 85 L155 65 Z" fill="#FFD700" stroke="#B8860B" stroke-width="2" stroke-linejoin="round">
                            <!-- 闪电的圆角效果 -->
                            <animate attributeName="stroke" values="#B8860B; #FFD700; #B8860B" dur="0.3s" begin="chargeAnim.end" fill="freeze" repeatCount="1"/>
                        </path>
                        
                        <!-- 闪电充电动画 -->
                        <path d="M150 65 L135 85 L145 85 L130 105 L150 85 L140 85 L155 65 Z" fill="none" stroke="white" stroke-width="6" stroke-linejoin="round" opacity="0">
                            <animate attributeName="opacity" values="0; 0.8; 0" dur="0.4s" begin="chargeAnim.end" fill="freeze" repeatCount="1"/>
                            <animate attributeName="stroke-width" values="6; 10; 6" dur="0.4s" begin="chargeAnim.end" fill="freeze" repeatCount="1"/>
                        </path>
                    </g>
                    
                    <!-- 充电动画效果 -->
                    <g id="chargingEffects" opacity="0.8">
                        <!-- 动态效果 - 充电粒子 -->
                        <circle cx="60" cy="80" r="2" fill="#2E9BFF">
                            <animate attributeName="cx" from="60" to="240" dur="1s" begin="0.5s" repeatCount="indefinite"/>
                            <animate attributeName="opacity" values="0;1;0" dur="1s" begin="0.5s" repeatCount="indefinite"/>
                        </circle>
                        <circle cx="80" cy="70" r="1.5" fill="#4A6FA5">
                            <animate attributeName="cx" from="80" to="240" dur="1.2s" begin="0.8s" repeatCount="indefinite"/>
                            <animate attributeName="opacity" values="0;0.8;0" dur="1.2s" begin="0.8s" repeatCount="indefinite"/>
                        </circle>
                        <circle cx="70" cy="90" r="1.5" fill="#2E9BFF">
                            <animate attributeName="cx" from="70" to="240" dur="1.5s" begin="1.1s" repeatCount="indefinite"/>
                            <animate attributeName="opacity" values="0;0.7;0" dur="1.5s" begin="1.1s" repeatCount="indefinite"/>
                        </circle>
                    </g>
                    
                    <!-- 充满时的闪光效果 -->
                    <g id="fullChargeFlash" opacity="0">
                        <rect x="0" y="0" width="300" height="160" fill="white" opacity="0.5">
                            <animate attributeName="opacity" values="0; 0.6; 0" dur="0.3s" begin="chargeAnim.end" fill="freeze"/>
                        </rect>
                    </g>
                </svg>
            </div>
            
            <p class="description">
                此动画展示了纯SVG实现的圆角闪电图标充电效果。电池充满时，闪电图标会闪烁一次，并有强光效果。
            </p>
            
            <button class="restart-btn" onclick="restartAnimation()">重新开始动画</button>
        </div>
        
        <p class="powered-by">纯SVG动画效果 | 无JavaScript动画库</p>
    </div>

    <script>
        // 更新电池百分比
        const chargeAnim = document.getElementById('chargeAnim');
        const percentage = document.getElementById('percentage');
        const status = document.getElementById('status');
        
        chargeAnim.addEventListener('beginEvent', () => {
            let percent = 0;
            const interval = setInterval(() => {
                percent += 1;
                if (percent <= 100) {
                    percentage.textContent = percent + '%';
                } else {
                    clearInterval(interval);
                }
            }, 40);
        });
        
        chargeAnim.addEventListener('endEvent', () => {
            status.textContent = "已充满！";
            status.style.color = "#FFD700";
            status.style.fontWeight = "bold";
        });
        
        function restartAnimation() {
            // 重置动画
            const chargeLevel = document.getElementById('chargeLevel');
            chargeLevel.setAttribute('width', '0');
            
            // 重置文本
            percentage.textContent = '0%';
            status.textContent = '正在充电...';
            status.style.color = '';
            status.style.fontWeight = '';
            
            // 重新开始动画
            setTimeout(() => {
                chargeLevel.innerHTML = '<animate attributeName="width" from="0" to="196" dur="4s" fill="freeze" begin="0.5s" repeatCount="1" id="chargeAnim"/>';
            }, 50);
        }
    </script>
</body>
</html>
